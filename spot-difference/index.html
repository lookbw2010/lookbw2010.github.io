<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<title>오늘의 틀린 그림 찾기 | 품스 두뇌 건강 게임</title>
<meta name="description" content="위아래 두 그림에서 다른 곳을 찾는 두뇌 건강 게임. 봄날 거실, 한강 공원 소풍, 한옥 찻상, 전통시장, 바닷가 등대까지 5단계 18군데. 설치 없이 바로 시작하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="오늘의 틀린 그림 찾기">
<meta property="og:description" content="5분이면 끝나는 두뇌 건강 게임. 5단계 18군데, 다른 곳을 찾아보세요.">
<meta property="og:url" content="https://lookbw2010.github.io/spot-difference/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --cream:#FAF6EE; --card:#FFFDF7; --navy:#152A4A; --gold:#C99A55;
    --gold-soft:#F0DFC2; --teal:#0E7A78; --text:#17233B; --muted:#5B6A80; --line:#E9E0D1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(circle at 6% -8%, #FDF2E0 0%, rgba(253,242,224,0) 52%),
      radial-gradient(circle at 98% 4%, #E7F2EF 0%, rgba(231,242,239,0) 46%),
      var(--cream);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "NanumGothic", "Segoe UI", sans-serif;
    -webkit-text-size-adjust:100%; word-break:keep-all; line-height:1.45;
    overscroll-behavior:none;
  }
  .app{
    height:100vh; height:100dvh; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    gap:7px;
  }
  header{flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
  .brand .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
  h1{font-size:18.5px;line-height:1.2;margin:2px 0 6px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .stages{display:flex;align-items:center;gap:5px}
  .stages i{
    width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
    font-style:normal;font-size:11.5px;font-weight:800;background:#EFE4CF;color:#8A7452;
    transition:background .2s,color .2s;
  }
  .stages i.on{background:var(--navy);color:#fff}
  .stages i.done{background:var(--teal);color:#fff}
  .stage-name{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:800;color:var(--navy);font-size:15px;
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 11px;
    box-shadow:0 2px 8px rgba(21,42,74,.06);
  }
  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .pic{
    position:relative;flex:0 0 auto;border-radius:15px;overflow:hidden;
    background:var(--card);border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(21,42,74,.07);
  }
  .pic svg{display:block;width:100%;height:100%}
  .lab{
    position:absolute;top:5px;left:7px;z-index:2;pointer-events:none;
    font-size:10px;font-weight:800;letter-spacing:.02em;padding:2.5px 8px;border-radius:999px;
    background:rgba(21,42,74,.8);color:#fff;
  }
  .lab.diff{background:rgba(201,154,85,.96);color:#fff}
  footer{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding-top:1px}
  .count{flex:1 1 auto;font-size:14px;color:var(--muted);font-weight:700;line-height:1.2}
  .count b{font-size:20px;color:#D2402F;font-weight:800;margin-right:2px}
  button{
    font-family:inherit;font-size:14.5px;font-weight:800;border:0;border-radius:13px;
    padding:0 15px;height:48px;cursor:pointer;transition:transform .1s ease, background .15s;
    letter-spacing:-.01em;
  }
  button:active{transform:scale(.97)}
  .btn-hint{background:var(--gold-soft);color:#8A611F;border:1px solid #E4CFA9}
  .btn-hint:disabled{opacity:.45}
  .btn-reset{background:#fff;color:var(--muted);border:1px solid var(--line);padding:0 13px;font-size:13px;height:44px}
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
    background:rgba(21,42,74,.94);color:#fff;font-size:13.5px;font-weight:700;
    padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .22s, transform .22s;z-index:60;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .overlay{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:rgba(13,24,40,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .overlay[hidden]{display:none}
  .sheet{
    width:100%;max-width:330px;max-height:88dvh;overflow:auto;background:var(--card);
    border-radius:22px;padding:26px 22px 22px;text-align:center;
    box-shadow:0 24px 60px rgba(10,20,34,.35);border:1px solid var(--line);
  }
  .sheet .emoji{font-size:34px;line-height:1;margin-bottom:8px}
  .sheet h2{font-size:20px;margin:0 0 10px;color:var(--navy);font-weight:800;letter-spacing:-.02em}
  .sheet p{margin:0 0 18px;font-size:14.5px;color:var(--muted);line-height:1.6}
  .sheet p b{color:#D2402F}
  .sheet .big{font-size:26px;font-weight:800;color:var(--navy);display:block;margin:2px 0 2px;font-variant-numeric:tabular-nums}
  .sheet .primary{
    display:block;width:100%;background:var(--navy);color:#fff;height:52px;font-size:16px;
    box-shadow:0 10px 22px rgba(21,42,74,.22);margin-bottom:9px;
  }
  .sheet .ghost{
    display:flex;align-items:center;justify-content:center;width:100%;height:46px;
    text-decoration:none;font-size:14px;font-weight:800;color:var(--navy);
    background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;
  }
  .sheet .ghost.gold{background:var(--gold-soft);border-color:#E4CFA9;color:#8A611F}
  .sheet .tiny{font-size:11.5px;color:#93A0B1;margin:10px 0 0}
  .recs{margin:0 0 16px;text-align:left;border-top:1px solid var(--line)}
  .recs .rec{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 1px;border-bottom:1px solid var(--line);
    font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.3;
  }
  .recs .rec b{color:var(--navy);font-weight:800}
  .recs .rec .rt{font-variant-numeric:tabular-nums;color:#8A7452;font-weight:800;white-space:nowrap}
  @media (prefers-color-scheme: dark){
    body{background:radial-gradient(circle at 6% -8%, #22303f 0%, rgba(34,48,63,0) 52%),radial-gradient(circle at 98% 4%, #16302f 0%, rgba(22,48,47,0) 46%),#101821;color:#E8EEF6}
    h1{color:#F3F7FB}
    .stages i{background:#243243;color:#9FB0C4}
    .stages i.on{background:#F0DFC2;color:#152A4A}
    .timer{background:#17222E;border-color:#26333F;color:#F3F7FB}
    .pic{background:#17222E;border-color:#26333F}
    .btn-reset{background:#17222E;border-color:#26333F;color:#9FB0C4}
    .sheet{background:#17222E;border-color:#26333F}
    .sheet h2{color:#F3F7FB}
    .sheet .ghost{background:#101821;border-color:#26333F;color:#DBE6F1}
    .sheet .primary{background:#F0DFC2;color:#152A4A}
    .recs{border-top-color:#26333F}
    .recs .rec{border-bottom-color:#26333F;color:#9FB0C4}
    .recs .rec b{color:#F3F7FB}
    .count b{color:#F0705E}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span>PUMSS 두뇌 건강</div>
    <h1>오늘의 틀린 그림 찾기</h1>
    <div class="hud">
      <div class="stages" id="stages">
        <i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><span class="stage-name" id="stageName">따스한 봄날 거실</span>
      </div>
      <div class="timer" id="timer">0:00</div>
    </div>
  </header>

  <main class="board" id="board">
    <div class="pic" id="picTop">
      <span class="lab">원본 그림</span>
      <div id="boxTop" style="width:100%;height:100%"></div>
    </div>
    <div class="pic" id="picBot">
      <span class="lab diff">틀린 그림</span>
      <div id="boxBot" style="width:100%;height:100%"></div>
    </div>
  </main>

  <footer>
    <div class="count"><b id="remain">3</b>곳 남았어요</div>
    <button class="btn-hint" id="hintBtn">힌트 보기</button>
    <button class="btn-reset" id="resetBtn">처음부터</button>
  </footer>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>
</div>

  var SKYLINE = (function(){
    var arr = [[2,94,24,14],[20,86,32,16],[40,100,18,12],[56,92,26,14],[74,98,20,12],[92,84,34,18],
               [114,96,22,14],[132,90,28,16],[156,100,18,12],[176,86,32,14],[198,96,22,14],

    for (var i=0;i<arr.length;i++){
      s += '<rect x="'+arr[i][0]+'" y="'+arr[i][1]+'" width="'+arr[i][3]+'" height="'+arr[i][2]+'"/>';

    var bagLine = alt ? '#254A67' : '#CE9C36';

    var awning = '';
    for (var i = 0; i < 15; i++){
      var ax = i * 24;
      var ac = (i % 2 === 0) ? (i === 4 ? awnCol : '#D9603F') : '#FBF1DE';
      awning += '<rect x="' + ax + '" y="14" width="24" height="40" fill="' + ac + '"/>' +
                '<path d="M' + ax + ' 54 a 12 9 0 0 0 24 0 z" fill="' + ac + '"/>';

  var SHARE_URL = 'https://lookbw2010.github.io/spot-difference/';
  var HUB_URL = '../';
  var PUMSS_URL = 'https://www.pumss.co.kr/SP/10.do';

  var el = function(id){ return document.getElementById(id); };
  var boxTop = el('boxTop'), boxBot = el('boxBot'), board = el('board');
  var overlay = el('overlay'), sheet = el('sheet'), toastEl = el('toast');
  var remainEl = el('remain'), timerEl = el('timer'), stageNameEl = el('stageName');
  var hintBtn = el('hintBtn'), resetBtn = el('resetBtn'), stagesEl = el('stages');

  var S = { stage:0, found:{}, hints:0, times:[], running:false, t0:0, missed:0 };
  var tick = null, hintTimer = null, toastTimer = null;

  function svgOf(box){ return box.querySelector('svg'); }

  function renderBoard(){
    var st = STAGES[S.stage];
    boxTop.innerHTML = st.scene('a', false);
    boxBot.innerHTML = st.scene('b', true);
  }

  function updateHud(){
    var st = STAGES[S.stage];
    stageNameEl.textContent = st.name;
    remainEl.textContent = String(st.diffs.length - Object.keys(S.found).length);
    var chips = stagesEl.querySelectorAll('i');
    for (var i=0;i<chips.length;i++){
      chips[i].className = i < S.stage ? 'done' : (i === S.stage ? 'on' : '');
    }
    var left = st.diffs.length - Object.keys(S.found).length;
    hintBtn.disabled = left === 0;
  }

  function fmt(ms){
    var s = Math.max(0, Math.round(ms/1000));
    return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2);
  }
  function fmtLong(ms){
    var s = Math.max(0, Math.round(ms/1000));
    var m = Math.floor(s/60);
    return m > 0 ? (m + '분 ' + (s%60) + '초') : (s + '초');
  }

  function startTimer(){
    S.t0 = performance.now();
    S.running = true;
    clearInterval(tick);
    tick = setInterval(function(){
      if (!S.running) return;
      timerEl.textContent = fmt(performance.now() - S.t0);
    }, 250);
    timerEl.textContent = '0:00';
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
  }

  var audioCtx = null;
  function tone(freq, dur, delay, type){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.1, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.13));
      o.start(t); o.stop(t + (dur || 0.13) + 0.03);
    }catch(e){}
  }

  function markFound(d){
    var boxes = [boxTop, boxBot];
    for (var b=0;b<boxes.length;b++){
      var svg = svgOf(boxes[b]);
      if (!svg) continue;
      var g = document.createElementNS(NS, 'g');
      var halo = document.createElementNS(NS, 'circle');
      halo.setAttribute('cx', d.x); halo.setAttribute('cy', d.y); halo.setAttribute('r', d.r);
      halo.setAttribute('fill', 'none'); halo.setAttribute('stroke', '#FFFFFF');
      halo.setAttribute('stroke-width', '11'); halo.setAttribute('opacity', '.85');
      g.appendChild(halo);

      var ring = document.createElementNS(NS, 'circle');
      ring.setAttribute('cx', d.x); ring.setAttribute('cy', d.y); ring.setAttribute('r', d.r);
      ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#E2332B');
      ring.setAttribute('stroke-width', '6'); ring.setAttribute('stroke-linecap', 'round');
      var C = 2 * Math.PI * d.r;
      ring.style.strokeDasharray = C;
      ring.style.strokeDashoffset = C;
      ring.style.transition = 'stroke-dashoffset .45s ease-out';
      g.appendChild(ring);
      (function(r){ requestAnimationFrame(function(){ r.style.strokeDashoffset = 0; }); })(ring);

      var badge = document.createElementNS(NS, 'g');
      var bx = d.x + d.r * 0.72, by = d.y - d.r * 0.72;
      var bc = document.createElementNS(NS, 'circle');
      bc.setAttribute('cx', bx); bc.setAttribute('cy', by); bc.setAttribute('r', '11');
      bc.setAttribute('fill', '#1E9E6A'); bc.setAttribute('stroke', '#FFFFFF'); bc.setAttribute('stroke-width', '2.5');
      badge.appendChild(bc);
      var ck = document.createElementNS(NS, 'path');
      ck.setAttribute('d', 'M' + (bx - 5) + ' ' + by + ' l 3.6 4 l 6.4 -7');
      ck.setAttribute('fill', 'none'); ck.setAttribute('stroke', '#FFFFFF');
      ck.setAttribute('stroke-width', '2.6'); ck.setAttribute('stroke-linecap', 'round');
      ck.setAttribute('stroke-linejoin', 'round');
      badge.appendChild(ck);
      g.appendChild(badge);

      svg.appendChild(g);
    }
  }

  function showHint(){
    var st = STAGES[S.stage];
    var target = null;
    for (var i=0;i<st.diffs.length;i++){
      if (!S.found[st.diffs[i].id]){ target = st.diffs[i]; break; }
    }
    if (!target) return;
    S.hints++;
    tone(660, 0.1, 0, 'triangle');

    var boxes = [boxTop, boxBot];
    for (var b=0;b<boxes.length;b++){
      var svg = svgOf(boxes[b]);
      if (!svg) continue;
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'hint-mark');
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', target.x); c.setAttribute('cy', target.y);
      c.setAttribute('r', target.r + 5);
      c.setAttribute('fill', '#C99A55'); c.setAttribute('fill-opacity', '.12');
      c.setAttribute('stroke', '#C99A55'); c.setAttribute('stroke-width', '3.5');
      c.setAttribute('stroke-dasharray', '8 7');
      c.style.animation = 'pulse 1.1s ease-in-out infinite';
      g.appendChild(c);
      svg.appendChild(g);
    }
    showToast('반짝이는 곳을 살펴보세요');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){
      var hs = document.querySelectorAll('.hint-mark');
      for (var k=0;k<hs.length;k++) hs[k].parentNode.removeChild(hs[k]);
    }, 4200);
    updateHud();
  }

  function scenePoint(ev, svg){
    var rect = svg.getBoundingClientRect();
    var W = 360, H = 260;
    var scale = Math.min(rect.width / W, rect.height / H);
    var ox = (rect.width - W * scale) / 2;
    var oy = (rect.height - H * scale) / 2;
    var cx = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX);
    var cy = (ev.touches && ev.touches[0] ? ev.touches[0].clientY : ev.clientY);
    return { x: (cx - rect.left - ox) / scale, y: (cy - rect.top - oy) / scale };
  }

  function onBoardClick(ev){
    if (!S.running) return;
    var svg = ev.target.closest ? ev.target.closest('svg') : null;
    if (!svg) return;
    var p = scenePoint(ev, svg);
    var st = STAGES[S.stage];
    for (var i=0;i<st.diffs.length;i++){
      var d = st.diffs[i];
      if (S.found[d.id]) continue;
      var dx = p.x - d.x, dy = p.y - d.y;
      if (Math.sqrt(dx*dx + dy*dy) <= d.r){
        S.found[d.id] = true;
        markFound(d);
        var left = st.diffs.length - Object.keys(S.found).length;
        tone(880, 0.12, 0, 'sine');
        tone(1180, 0.14, 0.1, 'sine');
        if (navigator.vibrate) { try{ navigator.vibrate(28); }catch(e){} }
        if (left > 0){
          showToast('찾았어요! ' + left + '곳 남았어요');
        }
        updateHud();
        if (left === 0) setTimeout(clearStage, 520);
        return;
      }
    }
    if (onAlreadyFound(p)) return;
    S.missed++;
    tone(300, 0.08, 0, 'sine');
    showToast(S.missed % 4 === 3 ? '힌트 보기 버튼을 눌러보세요' : '여기가 아니에요. 천천히 다시 찾아보세요');
  }

  function onAlreadyFound(p){
    var st = STAGES[S.stage];
    for (var i=0;i<st.diffs.length;i++){
      var d = st.diffs[i];
      if (!S.found[d.id]) continue;
      var dx = p.x - d.x, dy = p.y - d.y;
      if (Math.sqrt(dx*dx + dy*dy) <= d.r){
        showToast('이미 찾은 곳이에요');
        return true;
      }
    }
    return false;
  }

  function overlayCard(html){
    sheet.innerHTML = html;
    overlay.hidden = false;
    toastEl.classList.remove('show');
    clearTimeout(toastTimer);
  }

  function introCard(){
    overlayCard(
      '<div class="emoji">🔍</div>' +
      '<h2>오늘의 틀린 그림 찾기</h2>' +
      '<p>위아래 두 그림에서<br><b>다른 곳을 하나씩</b> 찾아보세요.<br>1단계부터 5단계까지 모두 18군데,<br>5분이면 충분해요.<br>천천히 하셔도 괜찮아요.</p>' +
      '<button class="primary" id="startBtn">시작하기</button>' +
      '<p class="tiny">찾은 곳은 빨간 동그라미로 표시돼요</p>'
    );
    el('startBtn').addEventListener('click', startGame);
  }

  function clearStage(){
    S.running = false;
    clearInterval(tick);
    var took = performance.now() - S.t0;
    S.times.push(took);
    tone(784, 0.12, 0, 'sine'); tone(988, 0.12, 0.1, 'sine'); tone(1319, 0.2, 0.2, 'sine');

    if (S.stage >= STAGES.length - 1){ finalCard(); return; }

    var next = S.stage + 1;
    overlayCard(
      '<div class="emoji">🎉</div>' +
      '<h2>' + (S.stage + 1) + '단계 성공!</h2>' +
      '<p>걸린 시간 <b>' + fmt(took) + '</b><br>' +
      '다음은 <b>' + STAGES[next].name + '</b>이에요.</p>' +
      '<button class="primary" id="nextBtn">' + (next + 1) + '단계 시작하기 →</button>' +
      '<p class="tiny">힌트 ' + S.hints + '번 사용</p>'
    );
    el('nextBtn').addEventListener('click', function(){ goStage(next); });
  }

  function finalCard(){
    var total = 0, spots = 0, rows = '';
    for (var i=0;i<STAGES.length;i++){
      var t = S.times[i] || 0;
      total += t; spots += STAGES[i].diffs.length;
      rows += '<div class="rec"><span>' + (i + 1) + '단계 <b>' + STAGES[i].name + '</b></span>' +
              '<span class="rt">' + fmt(t) + '</span></div>';
    }
    overlayCard(
      '<div class="emoji">🏆</div>' +
      '<h2>모두 찾았어요!</h2>' +
      '<p>총 걸린 시간<span class="big">' + fmtLong(total) + '</span>' +
      spots + '군데를 모두 찾으셨어요.<br>오늘 두뇌도 맑게 깨어났습니다.</p>' +
      '<div class="recs">' + rows + '</div>' +
      '<button class="primary" id="shareBtn">카톡·친구에게 공유하기</button>' +
      '<a class="ghost" href="' + HUB_URL + '">허브로 돌아가기</a>' +
      '<a class="ghost gold" href="' + PUMSS_URL + '">더 많은 생활·경제 정보 &amp; 상담</a>' +
      '<p class="tiny" style="margin:4px 0 0">힌트 ' + S.hints + '번 사용 · ' + (new Date().getMonth() + 1) + '월 ' + new Date().getDate() + '일 기록</p>' +
      '<p class="tiny" style="margin:8px 0 0"><button id="againBtn" style="background:none;color:#8A7452;font-size:12.5px;font-weight:800;height:auto;padding:6px 10px;text-decoration:underline">처음부터 다시 하기</button></p>'
    );
    el('shareBtn').addEventListener('click', shareGame);
    el('againBtn').addEventListener('click', startGame);
  }

  function shareGame(){
    var spots = 0, total = 0;
    for (var i=0;i<STAGES.length;i++){ spots += STAGES[i].diffs.length; total += (S.times[i] || 0); }
    var text = '오늘의 틀린 그림 찾기 — 5분이면 끝나는 두뇌 건강 게임. 나는 ' +
      fmtLong(total) + ' 만에 ' + spots + '군데를 다 찾았어요!';
    if (navigator.share){
      navigator.share({ title: '오늘의 틀린 그림 찾기', text: text, url: SHARE_URL })
        .catch(function(){});
      return;
    }
    var done = function(){
      showToast('링크를 복사했어요. 카톡에 붙여넣어 보내세요');
      tone(880, 0.1, 0, 'sine');
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(SHARE_URL).then(done).catch(function(){
        window.prompt('아래 링크를 복사해 친구에게 보내세요', SHARE_URL);
      });
    } else {
      window.prompt('아래 링크를 복사해 친구에게 보내세요', SHARE_URL);
    }
  }

  function goStage(i){
    S.stage = i;
    S.found = {};
    overlay.hidden = true;
    renderBoard();
    updateHud();
    layout();
    startTimer();
  }

  function startGame(){
    S.found = {}; S.hints = 0; S.times = []; S.missed = 0;
    goStage(0);
  }

  function resetGame(){
    S.running = false;
    clearInterval(tick);
    timerEl.textContent = '0:00';
    introCard();
  }

  board.addEventListener('click', onBoardClick);
  hintBtn.addEventListener('click', function(){ if (S.running) showHint(); });
  resetBtn.addEventListener('click', function(){
    if (Object.keys(S.found).length === 0 && !S.running){ return; }
    resetGame();
  });

  /* 그림이 카드에 꽉 차도록 크기 계산 (레터박스 없이) */
  function layout(){
    var W = 360, H = 260, gap = 6;
    var bw = board.clientWidth, bh = board.clientHeight;
    if (!bw || !bh) return;
    var ph = Math.min((bh - gap) / 2, bw * H / W);
    var pw = ph * W / H;
    var pics = [el('picTop'), el('picBot')];
    for (var i=0;i<pics.length;i++){
      pics[i].style.width = Math.floor(pw) + 'px';
      pics[i].style.height = Math.floor(ph) + 'px';
    }
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 260); });

  /* 대기 상태 미리보기 */
  renderBoard();
  updateHud();
  layout();
  setTimeout(layout, 60);
  introCard();
})();
</script>
<style>
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</body>
</html>
