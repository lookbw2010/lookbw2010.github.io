<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별빛 편지 — 돌려야 열리는 3D 비밀 편지</title>
<meta name="description" content="칠흑 같은 밤하늘에 흩어진 별빛. 손가락으로 화면을 돌려 각도를 맞추면, 점들이 모여 숨겨진 3D 형상과 비밀 메시지가 찰칵 열립니다. 나만의 별빛 편지를 만들어 링크로 보내보세요.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="별빛 편지 — 돌려야 열리는 3D 비밀 편지">
<meta property="og:description" content="돌려서 각도를 맞추면 별빛이 모여 편지가 열립니다. 나만의 비밀 편지를 링크로 보내보세요.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://lookbw2010.github.io/spin-letter/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cg fill='%23FFC96B'%3E%3Ccircle cx='32' cy='20' r='3'/%3E%3Ccircle cx='44' cy='32' r='3' fill='%236FE3FF'/%3E%3Ccircle cx='32' cy='44' r='3' fill='%23FF7FA8'/%3E%3Ccircle cx='20' cy='32' r='3' fill='%23B78CFF'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css?v=5">
</head>
<body>

<canvas id="scene" aria-label="별빛 3D 파티클"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><span class="brand-star" aria-hidden="true">✦</span><span>별빛 편지</span></div>
  <div class="top-actions">
    <button type="button" id="createBtn" class="chip">만들기</button>
    <button type="button" id="muteBtn" class="icon-btn" aria-pressed="false" aria-label="소리 끄기">
      <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M16.2 8.6a4.4 4.4 0 0 1 0 6.8"/><path d="M18.8 6.2a7.9 7.9 0 0 1 0 11.6"/>
      </svg>
      <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M16.6 9.4l4.6 5.2"/><path d="M21.2 9.4l-4.6 5.2"/>
      </svg>
    </button>
  </div>
</header>

<div class="start-note" id="startNote" hidden>
  <span class="note-mark" aria-hidden="true">✦</span>
  <span>누군가 남긴 별빛 편지</span>
</div>

<!-- 잠금 상태 하단 -->
<footer class="dock" id="dock">
  <div class="gauge-wrap">
    <div class="gauge-head">
      <span id="gaugeText">별빛이 흩어져 있어요</span>
      <span id="gaugePct" class="gauge-pct">0%</span>
    </div>
    <div class="gauge"><i id="gaugeFill"></i></div>
  </div>
  <p class="hint-line" id="hintLine"><span class="swipe-ico" aria-hidden="true">↔</span> 화면을 좌우로 돌려 별빛을 모아보세요</p>
</footer>

<!-- 열린 편지 -->
<section class="letter" id="letter" aria-live="polite">
  <p class="letter-kicker"><span aria-hidden="true">✦</span> 편지가 열렸어요</p>
  <p class="letter-body" id="letterBody"></p>
  <div class="letter-actions">
    <button type="button" id="againBtn" class="ghost-btn">다시 돌리기</button>
    <button type="button" id="makeBtn" class="primary-btn">나만의 편지 만들기</button>
  </div>
</section>

<div class="backdrop" id="backdrop" hidden></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle">나만의 별빛 편지</h2>
    <button type="button" id="sheetClose" class="icon-btn close" aria-label="닫기">✕</button>
  </div>

  <div class="sheet-body">
    <p class="field-label">모양</p>
    <div class="shape-row" id="shapeRow">
      <button type="button" class="shape" data-shape="wine"><span class="emo">🍷</span><span>와인잔</span></button>
      <button type="button" class="shape" data-shape="heart"><span class="emo">❤️</span><span>하트</span></button>
      <button type="button" class="shape" data-shape="tree"><span class="emo">🎄</span><span>트리</span></button>
      <button type="button" class="shape" data-shape="cake"><span class="emo">🎂</span><span>케이크</span></button>
      <button type="button" class="shape" data-shape="coffee"><span class="emo">☕</span><span>커피잔</span></button>
      <button type="button" class="shape" data-shape="gift"><span class="emo">🎁</span><span>선물상자</span></button>
      <button type="button" class="shape" data-shape="clover"><span class="emo">🍀</span><span>클로버</span></button>
      <button type="button" class="shape" data-shape="moon"><span class="emo">🌙</span><span>초승달</span></button>
      <button type="button" class="shape" data-shape="text"><span class="emo">✨</span><span>글자만</span></button>
    </div>

    <p class="field-label">비밀 메시지</p>
    <div class="input-wrap">
      <input id="msgInput" type="text" maxlength="60" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="받는 사람에게 남길 한마디">
      <button type="button" id="msgClear" class="clear" aria-label="메시지 지우기">×</button>
      <button type="button" id="voiceBtn" class="mic-btn" aria-pressed="false" aria-label="말로 입력" title="말로 입력">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2.6" width="6" height="11" rx="3"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
          <path d="M12 17.6V21"/><path d="M8.7 21h6.6"/>
        </svg>
      </button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="field-note">보낸 링크는 <b>잠긴 상태</b>로 열려, 받는 사람이 직접 돌려야 편지가 열립니다.</p>
  </div>

  <div class="sheet-foot">
    <button type="button" id="previewBtn" class="ghost-btn">미리보기</button>
    <button type="button" id="shareBtn" class="primary-btn">비밀 링크 복사</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./engine.js?v=2"></script>
<script src="./app.js?v=5"></script>
</body>
</html>
