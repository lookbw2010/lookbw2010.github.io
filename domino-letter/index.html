<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 한 줄 — 3D 글자 블록 탑</title>
<meta name="description" content="알록달록한 3D 글자 블록이 아슬아슬 쌓인 탑. 톡 누르면 블록이 와르르 무너져 황금빛 속에서 한 줄로 정렬되고, 숨어 있던 문구와 편지가 드러납니다. 문구를 숨겨 링크 하나로 보내보세요.">
<meta name="theme-color" content="#080B12">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="오늘의 한 줄 — 3D 글자 블록 탑">
<meta property="og:description" content="블록을 톡 누르면 와르르 무너지며 숨어 있던 문구가 황금빛으로 드러나요. 링크 하나로 마음을 보내세요.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C1220'/%3E%3Crect x='13' y='22' width='24' height='24' rx='6' fill='%238B5CF6'/%3E%3Crect x='13' y='18' width='24' height='6' rx='3' fill='%23B99BFF'/%3E%3Crect x='38' y='22' width='6' height='24' rx='3' fill='%236D3FD6'/%3E%3Crect x='40' y='13' width='12' height='12' rx='3' fill='%23F2C230'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>

<!-- ══════════ 탑 화면 ══════════ -->
<section class="view" id="receiveView">

  <header class="bar">
    <button type="button" class="iconbtn" id="soundBtn" aria-pressed="false" aria-label="소리 끄기">
      <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3.3L12 5.4v13.2L7.3 14.6H4z"/><path d="M16.1 8.7a4.5 4.5 0 0 1 0 6.6"/><path d="M18.7 6.3a8 8 0 0 1 0 11.4"/>
      </svg>
      <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3.3L12 5.4v13.2L7.3 14.6H4z"/><path d="M16.4 9.5l4.4 5"/><path d="M20.8 9.5l-4.4 5"/>
      </svg>
    </button>
    <h1 class="appTitle" id="brandTitle">오늘의 한 줄</h1>
    <button type="button" class="chip" id="toMakeBtn">만들기</button>
  </header>
  <p class="sub" id="brandSub">블록을 눌러 정리해보세요</p>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="글자 블록 탑 정리하기">
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="stageGlow" id="stageGlow" aria-hidden="true"></div>

    <div class="finger" id="finger" aria-hidden="true">
      <span class="ring r1"></span><span class="ring r2"></span>
      <svg class="hand" viewBox="0 0 48 58" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19.6 31.5V11.2a3.3 3.3 0 0 1 6.6 0v14.6"/>
          <path d="M26.2 24.6v-2.2a3.1 3.1 0 0 1 6.2 0v3.4"/>
          <path d="M32.4 26.1a3 3 0 0 1 6 0v9.6a11.6 11.6 0 0 1-11.6 11.6h-2.2a9.8 9.8 0 0 1-8.2-4.4l-5-7.3a3.1 3.1 0 0 1 5.1-3.5l2.5 3.3V31"/>
        </g>
      </svg>
    </div>

    <div class="bottom" id="bottomArea">
      <div class="stackCta" id="stackCta">
        <p class="ctaLead">블록에 문구와 편지를 숨겨<br>링크 하나로 보내요</p>
        <button type="button" class="btn primary big" id="ctaMake">나도 글자 블록 탑 만들기</button>
      </div>

      <section class="letter" id="letter" hidden aria-live="polite">
        <p class="lTo" id="lTo"></p>
        <p class="lPhrase" id="lPhrase"></p>
        <p class="lBody" id="lBody"></p>
        <p class="lSign" id="lSign"></p>
        <div class="lActions">
          <button type="button" class="btn ghost" id="againBtn">다시 쌓기</button>
          <button type="button" class="btn primary" id="makeBtn">나도 만들기</button>
        </div>
      </section>
    </div>
  </div>

  <p class="sr" id="live" aria-live="polite"></p>
</section>

<!-- ══════════ 만들기 화면 ══════════ -->
<section class="view makeView" id="makeView" hidden>
  <header class="bar">
    <button type="button" class="iconbtn" id="backBtn" aria-label="탑으로 돌아가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 5.5 8 12l6.5 6.5"/>
      </svg>
    </button>
    <h1 class="appTitle">블록 만들기</h1>
    <span class="barPad" aria-hidden="true"></span>
  </header>
  <p class="sub">문구와 마음을 숨겨 보내세요</p>

  <div class="stage mini" id="mkStage" role="button" tabindex="0" aria-label="미리보기 블록 탑 정리하기">
    <canvas class="gl" id="mkGl" aria-hidden="true"></canvas>
    <div class="stageGlow" id="mkStageGlow" aria-hidden="true"></div>
  </div>
  <div class="mkBar">
    <button type="button" class="chip" id="previewBtn">👆 미리 눌러보기</button>
    <span class="mkNote" id="mkNote">받는 사람 화면 그대로</span>
  </div>

  <form class="form" id="makeForm" autocomplete="off" novalidate>
    <div class="row2">
      <label class="field">
        <span class="lab">받는 사람</span>
        <input id="toInput" type="text" maxlength="16" placeholder="예: 지우" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field">
        <span class="lab">보내는 사람</span>
        <input id="fromInput" type="text" maxlength="16" placeholder="예: 보원" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
    </div>

    <label class="field">
      <span class="lab">숨길 문구 <em>2~12자</em><b class="count" id="phraseCount">0 / 12</b></span>
      <input id="phraseInput" type="text" maxlength="12" placeholder="예: HAPPY DAY" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </label>
    <div class="chips" id="phraseChips"></div>

    <label class="field">
      <span class="lab">편지 <em>블록이 정리된 뒤 열려요</em><b class="count" id="bodyCount">0 / 200</b></span>
      <textarea id="bodyInput" rows="4" maxlength="200" placeholder="받는 사람에게 전하고 싶은 마음을 적어주세요."></textarea>
    </label>

    <p class="note">편지는 서버에 저장하지 않고 링크 안에만 담겨요. 링크를 아는 사람만 열 수 있습니다.</p>

    <div class="cta">
      <button type="submit" class="btn primary big" id="copyBtn"><span aria-hidden="true">🔗</span> 링크 복사</button>
      <button type="button" class="btn ghost big" id="shareBtn" hidden><span aria-hidden="true">📤</span> 공유하기</button>
    </div>

    <div class="linkbox" id="linkBox" hidden>
      <span class="lab">보낼 링크</span>
      <input id="linkOut" type="text" readonly aria-label="보낼 링크">
    </div>
  </form>
  <footer class="foot"><p>글자 블록 탑 · 링크 하나로 마음을 숨겨 보내요</p></footer>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./vendor/three.min.js"></script>
<script src="./app.js?v=8"></script>
</body>
</html>
