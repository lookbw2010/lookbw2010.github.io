<script>
var errs = [];
window.__errs = errs;
['a','b','c'].forEach(function (id) {
  var f = document.getElementById(id);
  f.addEventListener('load', function () {
    try {
      var w = f.contentWindow;
      w.addEventListener('error', function (e) { errs.push(id + ':' + e.message); });
      var ce = w.console.error;
      w.console.error = function () { errs.push(id + ':console ' + Array.prototype.join.call(arguments, ' ')); ce.apply(w.console, arguments); };
    } catch (e) { errs.push(id + ':hook ' + e.message); }
  });
});
