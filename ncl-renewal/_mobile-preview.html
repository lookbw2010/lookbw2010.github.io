<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCL mobile preview</title>
<style>
  html, body { margin: 0; background: #1b2436; }
  body { zoom: 1.6; }
  iframe { width: 390px; border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<iframe id="f" title="mobile preview"></iframe>
<script>
  var p = new URLSearchParams(location.search).get('p') || 'index';
  var f = document.getElementById('f');
  f.src = './' + p + '.html';
  function size() {
    try { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px'; } catch (e) {}
  }
  f.addEventListener('load', function () { size(); setTimeout(size, 800); setTimeout(size, 2000); });
</script>
</body>
</html>
