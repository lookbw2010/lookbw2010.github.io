<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TypoPop — 살아 움직이는 1초 카드</title>
<meta name="description" content="문장 하나를 넣으면 핵심 단어가 살아 움직입니다. 우산·계단·크리스마스 트리·새해 해돋이·감사 인사·축하 팡파레까지 14가지 1초 모션 타이포 카드를 만들고 링크로 보내세요. 말로 입력해도 됩니다.">
<meta name="theme-color" content="#F2F3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="TypoPop — 살아 움직이는 1초 카드">
<meta property="og:description" content="글자가 크리스마스 트리가 되고, 새해 해돋이가 되고, 고맙다는 인사가 되고, 축하 폭죽이 됩니다. 문장 하나 혹은 한마디 말로 만드는 1초 모션 타이포 카드, 14가지.">
<meta property="og:image" content="https://lookbw2010.github.io/typopop/assets/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css?v=18">
</head>
<body>

<div id="studio">
  <header class="top">
    <a class="brand" href="./" aria-label="TypoPop"><span>TypoPop</span><i class="brand-dot" aria-hidden="true"></i></a>
    <div class="lang" id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko">KO</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <div class="field" id="field">
      <input id="input" type="text" maxlength="90" autocomplete="off" autocapitalize="none" spellcheck="false"
             aria-label="문장 입력">
      <div class="field-tools">
        <button type="button" id="clear" class="clear" aria-label="지우기" title="지우기">×</button>
        <button type="button" id="mic" class="mic" aria-label="말로 만들기" aria-pressed="false" title="말로 만들기">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.4a3 3 0 0 0-3 3v4.1a3 3 0 0 0 6 0V7.4a3 3 0 0 0-3-3Z"></path><path d="M6.6 11.4a5.4 5.4 0 0 0 10.8 0"></path><path d="M12 16.8v3"></path></svg>
          <span id="mic-text">말로 만들기</span>
        </button>
      </div>
    </div>

    <div class="hintrow">
      <span id="detect" class="detect"><i class="live-dot"></i><span id="detect-text">문장을 쓰면 핵심 단어가 살아나요</span></span>
      <button type="button" id="replay" class="replay">↻ 다시 재생</button>
    </div>

    <section class="stage" id="stage" data-theme="studio" aria-label="모션 무대">
      <svg id="svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="모션 타이포 카드"></svg>
    </section>

    <div class="presets" id="presets" role="group" aria-label="프리셋"></div>

    <div class="themes">
      <span class="themes-label" id="themes-label">무대</span>
      <div class="swatches" id="swatches" role="group" aria-label="무대 테마"></div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="copy"><span id="copy-text">링크 복사</span></button>
      <button type="button" class="btn ghost" id="preview">받는 사람 화면</button>
    </div>
  </main>
</div>

<div id="shareview" hidden data-theme="studio">
  <div class="sv-inner">
    <div class="sv-stage" id="sv-stage"></div>
    <div class="sv-foot">
      <button type="button" class="sv-cta" id="sv-cta">나도 만들어 보기 <span aria-hidden="true">→</span></button>
      <div class="sv-brand">TypoPop</div>
    </div>
  </div>
  <button type="button" class="sv-close" id="sv-close" aria-label="닫기">✕</button>
</div>

<div id="toast" class="toast" hidden></div>

<script src="./scene.js?v=18"></script>
<script src="./app.js?v=18"></script>
</body>
</html>
