<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>킨로 Kinlo — 오늘의 사진과 글</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Kinlo — a midnight photo magazine for everyday life. Walk, cook, grow, and write one honest line a day.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="킨로 Kinlo">
<meta property="og:description" content="오늘의 사진과 글을 담는 다크 매거진.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FFFFFF'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%231D4ED8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>KINLO</div>
    <div class="tools">
      <button type="button" class="tool" id="langBtn" aria-label="Language">
        <svg class="tool-globe" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.4 12h17.2M12 3.4c2.5 2.6 2.5 14.6 0 17.2M12 3.4c-2.5 2.6-2.5 14.6 0 17.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="tool-t" id="langLabel">KO</span>
      </button>
      <button type="button" class="tool" id="fontBtn" aria-label="Text size">
        <span class="tool-aa">Aa</span>
        <span class="bars" id="fontBars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </div>
  </header>

  <main class="main">

    <!-- ============ FEED ============ -->
    <section class="view" id="view-feed">
      <div class="masthead">
        <div class="mast-row">
          <span class="kicker" data-i18n="feed.title">오늘의 피드</span>
          <span class="kicker" id="issueNo">ISSUE 48</span>
        </div>
        <div class="mast-main">
          <h1 class="mast-date" id="feedDate"></h1>
          <div class="mast-side">
            <b id="feedWeek"></b>
            <span id="feedCount"></span>
          </div>
        </div>
        <p class="mast-tag" id="mastTag"></p>
      </div>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Topics"></nav>

      <div id="questionCard"></div>

      <div class="timeline" id="postList"></div>
      <p class="feed-end" id="feedEnd" data-i18n="feed.end">여기까지예요. 오늘도 천천히 둘러보세요.</p>
    </section>

    <!-- ============ CLUBS ============ -->
    <section class="view" id="view-clubs" hidden>
      <div class="section-head">
        <span class="kicker">Kinlo Clubs</span>
        <h1 class="section-title" data-i18n="clubs.title">취향 모임</h1>
        <p class="section-sub" data-i18n="clubs.sub">같은 것을 좋아하는 사람들과, 부담 없이.</p>
        <p class="section-meta" id="clubMeta"></p>
      </div>
      <div class="club-grid" id="clubList"></div>
    </section>

    <!-- ============ MINE ============ -->
    <section class="view" id="view-mine" hidden>
      <div id="profileCard"></div>

      <div class="myposts-head">
        <span class="kicker" data-i18n="mine.postsTitle">내가 쓴 글</span>
        <span class="myposts-count" id="myCount"></span>
      </div>
      <div class="myposts" id="myPosts"></div>
    </section>

    <!-- ============ SETTINGS ============ -->
    <section class="view" id="view-settings" hidden>
      <div class="section-head">
        <span class="kicker">Kinlo Settings</span>
        <h1 class="section-title" data-i18n="mine.settings">설정</h1>
        <p class="section-sub" id="settingsSub"></p>
      </div>

      <div class="set-list">
        <div class="set-row">
          <span class="set-label" data-i18n="ui.fontLabel">글자 크기</span>
          <div class="seg" id="fontRow" role="group" aria-label="Text size"></div>
        </div>
        <div class="set-row">
          <span class="set-label" data-i18n="mine.language">언어</span>
          <div class="seg" id="langRow" role="group" aria-label="Language"></div>
        </div>
      </div>

      <div class="note">
        <h3 data-i18n="mine.noteTitle">킨로가 지키는 것</h3>
        <p data-i18n="mine.note">광고와 낯선 링크를 받지 않습니다. 서로의 하루에 조용히 인사하는 공간입니다.</p>
      </div>

      <p class="build-note" data-i18n="mine.build">Kinlo — prototype</p>
    </section>
  </main>

  <!-- ============ DOCK ============ -->
  <nav class="dock" role="tablist" aria-label="Main">
    <div class="dock-in">
      <button type="button" class="dock-b" data-tab="feed" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7V20a1 1 0 0 1-1 1h-4.6v-5.4H9.6V21H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="dock-l" data-ui="dock.feed">피드</span>
      </button>
      <button type="button" class="dock-b" data-tab="clubs" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.4" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16.6" cy="9.6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M2.8 19.6c.6-3.2 3.1-4.9 6.2-4.9s5.6 1.7 6.2 4.9M15.4 14.9c2.6.1 4.7 1.5 5.3 4.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="dock-l" data-ui="dock.clubs">모임</span>
      </button>

      <button type="button" class="dock-mic" id="dockMic" aria-label="Write by voice">
        <span class="mic-circle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.8" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"></rect><path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0M12 18v3.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg>
        </span>
        <span class="dock-l" data-ui="dock.write">기록</span>
      </button>

      <button type="button" class="dock-b" data-tab="mine" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.4" y="3.6" width="15.2" height="16.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 8.2h8M8 12h8M8 15.8h4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="dock-l" data-ui="dock.mine">내 기록</span>
      </button>
      <button type="button" class="dock-b" data-tab="settings" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 8.4h16.8M3.6 15.6h16.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="9" cy="8.4" r="2.5" fill="#FFFFFF" stroke="currentColor" stroke-width="1.7"/><circle cx="15.2" cy="15.6" r="2.5" fill="#FFFFFF" stroke="currentColor" stroke-width="1.7"/></svg>
        <span class="dock-l" data-ui="dock.settings">설정</span>
      </button>
    </div>
  </nav>

  <!-- ============ WRITE STUDIO ============ -->
  <div class="studio" id="writeWrap" aria-hidden="true">
    <header class="studio-top">
      <button type="button" class="studio-close" data-close-write data-i18n-aria="ui.close" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="studio-h">
        <h2 data-i18n="write.title">글쓰기</h2>
        <p data-i18n="write.sub">말로 하면, 글이 됩니다.</p>
      </div>
      <span class="rec" aria-hidden="true"><i></i>REC</span>
    </header>

    <div class="studio-scroll">
      <div class="stage" id="micStage">
        <button type="button" class="mic-btn" id="voiceBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.6" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"></rect><path d="M5.2 11.4a6.8 6.8 0 0 0 13.6 0M12 18.2v3.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg>
        </button>
        <div class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p class="stage-label" id="voiceText">말로 편하게 쓰기</p>
        <p class="stage-status" id="voiceStatus">버튼을 누르고 오늘 있었던 일을 편하게 말해 보세요.</p>
        <button type="button" class="demo" id="voiceDemo">마이크가 안 되면 체험 모드로 채우기</button>
      </div>

      <label class="field">
        <span class="field-k" data-i18n="write.body">내용</span>
        <textarea id="writeText" rows="5" data-i18n-ph="write.placeholder" placeholder="오늘 있었던 일을 편하게 적어 주세요."></textarea>
      </label>

      <div class="field">
        <span class="field-k" data-i18n="write.topic">주제</span>
        <div class="topics" id="writeChips" role="group" aria-label="Topics"></div>
      </div>

      <div class="field">
        <span class="field-k" data-i18n="write.photo">사진 (선택)</span>
        <div class="photos" id="photoRow"></div>
      </div>
    </div>

    <footer class="studio-foot">
      <button type="button" id="submitPost" data-i18n="write.submit">킨로에 올리기</button>
    </footer>
  </div>

  <!-- ============ MODAL ============ -->
  <div class="modal-wrap" id="modalWrap" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal-x" data-close-modal data-i18n-aria="ui.close" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="i18n.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
