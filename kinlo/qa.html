<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinlo QA — 390 x 844</title>
<style>
  html, body { margin: 0; padding: 0; background: #E9ECF2; font-family: ui-sans-serif, system-ui, sans-serif; }
  .wrap { padding: 16px; display: flex; gap: 16px; align-items: flex-start; justify-content: center; }
  .frame { background: #fff; box-shadow: 0 10px 40px rgba(15, 23, 42, .18); width: 390px; height: 844px; overflow: hidden; }
  iframe { display: block; width: 405px; height: 844px; border: 0; }
  .cap { font-size: 12px; letter-spacing: .06em; color: #64748B; text-align: center; padding-top: 8px; }
  #m { font-size: 13px; font-weight: 700; color: #111827; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="frame"><iframe id="app" title="Kinlo 390x844"></iframe>
<script>
  document.getElementById("app").src = "./index.html?qa=" + Date.now();
  setInterval(function () {
    var f = document.getElementById("app");
    var d = f.contentDocument;
    if (!d || !d.documentElement) return;
    var de = d.documentElement, wide = [];
    d.querySelectorAll("body *").forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.width > 0 && r.right > de.clientWidth + 0.5) wide.push((el.className || el.tagName) + ":" + Math.round(r.right));
    });
    document.getElementById("m").textContent =
      "W " + de.clientWidth + " / SCROLL " + de.scrollWidth + " / FS " + getComputedStyle(d.body).fontSize +
      " / " + de.lang.toUpperCase() + " / WIDE " + (wide.slice(0, 3).join(",") || "none");
  }, 400);
</script></div>
    <div class="cap">390 × 844<br><span id="m">measuring…</span></div>
  </div>
</div>
</body>
</html>
